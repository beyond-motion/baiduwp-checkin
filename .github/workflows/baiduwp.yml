name: Baidu Wangpan Check-in

on:
  workflow_dispatch:
  schedule:
    - cron: "17 16 * * *"

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # 写 state.json 回仓库

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check-in
        env:
          BAIDUWP_ACCOUNTS: ${{ secrets.BAIDUWP_ACCOUNTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: python baiduwp.py

      # 无论签到成败都要写回状态（失败也是要记录的信息）
      - name: Commit state
        if: ${{ always() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && echo "state 无变化，跳过提交" && exit 0
          git commit -m "chore: update state $(date -u +%Y-%m-%d)"
          git push

  # 防 GitHub「60 天无活动自动禁用 schedule」。
  # 调 API 重置计时器，不依赖仓库有无新 commit。
  keepalive:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: checkin
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
